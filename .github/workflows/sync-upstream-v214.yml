name: Sync upstream and apply Antigravity 2.14 localization

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-upstream-v214.yml'

permissions:
  contents: write

jobs:
  sync-and-localize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/qqxpee/antigravity2-cn.git
          git fetch upstream main
          git merge --allow-unrelated-histories --no-edit upstream/main

      - name: Install Traditional Chinese converter
        run: python -m pip install --disable-pip-version-check opencc-python-reimplemented

      - name: Apply v2.14 dictionary updates and validate parity
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from opencc import OpenCC

          root = Path('.')
          updates = json.loads((root / '.github/v214_sc_updates.json').read_text(encoding='utf-8'))
          cc = OpenCC('s2twp')

          def to_tw(text: str) -> str:
              value = cc.convert(text)
              replacements = {
                  '智慧體': '智能體',
                  '智慧型體': '智能體',
                  '子代理': '子智能體',
                  '軟件': '軟體',
                  '文件': '檔案',
                  '插件': '外掛程式',
                  '終端': '終端機',
                  '帳號': '帳戶',
                  '窗口': '視窗',
                  '默認': '預設',
                  '代碼': '程式碼',
                  '分屏': '分割畫面',
              }
              for old, new in replacements.items():
                  value = value.replace(old, new)
              return value

          changed = 0
          for rel, mapping in updates.items():
              sc_path = root / rel
              tw_path = root / rel.replace('dicts/', 'dicts_tw/', 1)
              sc = json.loads(sc_path.read_text(encoding='utf-8'))
              tw = json.loads(tw_path.read_text(encoding='utf-8'))

              sc.update(mapping)
              for key, value in mapping.items():
                  tw[key] = to_tw(value)

              sc_path.write_text(json.dumps(sc, ensure_ascii=False, indent=4) + '\n', encoding='utf-8')
              tw_path.write_text(json.dumps(tw, ensure_ascii=False, indent=4) + '\n', encoding='utf-8')
              changed += len(mapping)

          # Keep README version metadata current.
          for readme in ('README.md', 'README_TW.md'):
              p = root / readme
              text = p.read_text(encoding='utf-8')
              text = text.replace('Antigravity v2.12.2', 'Antigravity v2.14.0')
              p.write_text(text, encoding='utf-8')

          # Mandatory parity check required by repository rules.
          sc_dir = root / 'dicts'
          tw_dir = root / 'dicts_tw'
          errors = []
          for sc_file in sorted(sc_dir.glob('*.json')):
              tw_file = tw_dir / sc_file.name
              if not tw_file.exists():
                  errors.append(f'missing TW file: {tw_file}')
                  continue
              sc_keys = set(json.loads(sc_file.read_text(encoding='utf-8')).keys())
              tw_keys = set(json.loads(tw_file.read_text(encoding='utf-8')).keys())
              if sc_keys != tw_keys:
                  errors.append(
                      f'{sc_file.name}: missing_in_tw={sorted(sc_keys-tw_keys)!r}; '
                      f'missing_in_sc={sorted(tw_keys-sc_keys)!r}'
                  )
          if errors:
              raise SystemExit('\n'.join(errors))

          print(f'Applied {changed} Simplified Chinese mappings and synchronized Traditional Chinese keys.')
          print('All dictionaries are perfectly aligned!')
          PY

      - name: Remove bootstrap files and commit synchronized project
        shell: bash
        run: |
          set -euo pipefail
          rm -f .sync-placeholder .github/v214_sc_updates.json .github/workflows/sync-upstream-v214.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git add -A
          git commit -m "feat(i18n): adapt dictionaries for Antigravity v2.14.0"
          git push origin main
