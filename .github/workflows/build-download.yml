name: Build Download Package

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  build:
    if: startsWith(github.event.issue.title, '[build-package]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build ZIP
        run: |
          mkdir -p dist
          zip -r dist/antigravity2-cn-v2.14.0.zip . \
            -x '.git/*' \
               '.github/*' \
               'dist/*' \
               '.sync-placeholder'
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: antigravity2-cn-v2.14.0
          path: dist/antigravity2-cn-v2.14.0.zip
          if-no-files-found: error
